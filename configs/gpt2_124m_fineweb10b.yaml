paths:
  data_root: edu_fineweb10B
  hellaswag_root: hellaswag
  output_dir: outputs/gpt2_124m_fineweb10b

model:
  block_size: 1024
  vocab_size: 50304
  n_layer: 12
  n_head: 12
  n_embd: 768

training:
  total_batch_size_tokens: 524288
  micro_batch_size: 16
  sequence_length: 1024
  max_steps: 19073
  max_learning_rate: 0.0006
  min_learning_rate: 0.00006
  warmup_steps: 715
  weight_decay: 0.1
  gradient_clip: 1.0
  precision: bfloat16
  seed: 42
  compile: false

evaluation:
  validation_interval: 250
  validation_batches: 20
  sample_interval: 1000
  full_hellaswag_interval: 5000
  full_hellaswag_at_end: true

checkpointing:
  interval: 1000
  keep_last: 3
  milestone_steps:
    - 5000
    - 10000
    - 15000
    - 19073

logging:
  scalar_interval: 10
  wandb_project: gpt2-from-scratch
  wandb_mode: online
  wandb_watch: disabled
  histogram_mode: disabled
  sample_prompt: "Hello, I'm a language model,"
  sample_max_length: 64
